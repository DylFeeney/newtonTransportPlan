services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: newtonPlan
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      # Keep container dependencies separate from the host filesystem.
      - node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  node_modules:

